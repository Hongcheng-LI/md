name: Build Dist

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.25.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install

      - name: Run build
        run: pnpm web build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-dist
          path: apps/web/dist
